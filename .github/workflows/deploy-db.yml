name: Deploy database migrations

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["supabase/migrations/**"]

permissions:
  contents: read

concurrency:
  group: production-db-deploy

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: .nvmrc
          require-lockfile: true
      - name: Push committed migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?}" "${SUPABASE_PROJECT_REF:?}" "${SUPABASE_DB_PASSWORD:?}"
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
          pnpm exec supabase db push --remote --yes
