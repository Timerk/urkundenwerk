name: Reset hosted demo now

# The database resets the hosted demo every night with pg_cron
# (supabase/migrations/20261124150000_demo_reset_job.sql). This approval-gated
# workflow runs the same reset on demand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-demo-reset

jobs:
  reset:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: .nvmrc
          require-lockfile: true
      - name: Restore the hosted demo firms
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?}" "${SUPABASE_PROJECT_REF:?}"
          pnpm exec supabase db query --remote="$SUPABASE_PROJECT_REF" --file supabase/demo/reset.sql --yes
