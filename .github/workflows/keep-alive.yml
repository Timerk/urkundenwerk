name: Keep hosted demo awake

on:
  schedule:
    - cron: "23 6 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check demo database health
        shell: bash
        env:
          DEMO_URL: ${{ vars.DEMO_URL || 'https://urkundenwerk.vercel.app' }}
        run: |
          response="$RUNNER_TEMP/demo-health.json"
          curl --fail-with-body --retry 3 --retry-delay 20 --max-time 30 \
            --silent --show-error --output "$response" "${DEMO_URL%/}/api/health"
          jq -e '.db == "ok"' "$response"
